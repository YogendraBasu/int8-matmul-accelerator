name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y verilator gcc make python3
      - name: Python model and tests
        run: make model
      - name: C driver tests
        run: make driver
      - name: RTL simulation
        run: make sim
